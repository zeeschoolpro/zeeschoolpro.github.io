<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeeSchool Manager Pro</title>
<meta name="description" content="ZeeSchool Manager Pro: school records, results, fees, CBT and e-Learning for Nigerian schools. By Zee Publishers, Minna.">
<meta name="theme-color" content="#13307a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #f4f7fc; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f4f7fc; }
  #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #f4f7fc; color: #13307a; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; transition: opacity .25s; }
  #load.off { opacity: 0; pointer-events: none; }
  #load .mark { width: 64px; height: 64px; }
  #load b { font-size: 20px; letter-spacing: .2px; }
  #load .bar { width: 160px; height: 4px; border-radius: 4px; background: #dbe3f0; overflow: hidden; }
  #load .bar i { display: block; width: 40%; height: 100%; background: #148ca3; border-radius: 4px; animation: go 1.1s ease-in-out infinite; }
  @keyframes go { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { #load .bar i { animation: none; width: 100%; } }
  #slow { margin: 6px 0 0; max-width: 340px; color: #56627a; font-size: 15px; }
  #slow a { display: inline-block; margin-top: 10px; padding: 10px 18px; border-radius: 8px; background: #13307a; color: #fff; text-decoration: none; font-weight: 600; }
  #slow a:focus-visible { outline: 3px solid #148ca3; outline-offset: 2px; }
</style>
</head>
<body>
<!--
  ZeeSchool Manager Pro's front door (Release M.13). It shows the Apps Script web app full screen at this address.
  Releasing a new version in Apps Script (Manage deployments > Edit > New version) changes nothing here.
  The script address keeps working on its own: it is the fallback, and the button below appears if the app is slow.
-->
<iframe id="app" name="zsapp" title="ZeeSchool Manager Pro" allow="clipboard-read; clipboard-write; fullscreen; camera; microphone; geolocation"></iframe>
<div id="load" role="status" aria-live="polite">
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#13307a"/><path d="M18 19h28v6L27 41h19v6H18v-6l19-16H18z" fill="#fff"/><circle cx="48" cy="17" r="5" fill="#148ca3"/></svg>
  <b>ZeeSchool Manager Pro</b>
  <div class="bar"><i></i></div>
  <p id="slow" hidden>This is taking longer than usual. Your connection may be slow, or the page may be blocked here.<br><a id="direct" href="#" target="_top">Open ZeeSchool directly</a></p>
</div>
<noscript><p style="position:fixed;inset:auto 0 0;padding:16px;background:#fff;margin:0">ZeeSchool needs JavaScript. <a href="https://script.google.com/macros/s/AKfycbw2raan9gRjiZr2j4nz5piCmniGHEH4sBwI_pv1RdsOr3FdjpvRQu61svLU0840xXYr/exec">Open ZeeSchool directly</a>.</p></noscript>
<script>
(function () {
  'use strict';
  // The deployed web app (Apps Script: Deploy > Manage deployments). New versions keep this address.
  var EXEC = 'https://script.google.com/macros/s/AKfycbw2raan9gRjiZr2j4nz5piCmniGHEH4sBwI_pv1RdsOr3FdjpvRQu61svLU0840xXYr/exec';
  // Apps Script shows the app's pages from this kind of address; messages from anywhere else are ignored.
  var APP_FRAME = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
  var WAIT = 20000;   // milliseconds before the "Open ZeeSchool directly" button shows
  // What a sign-in may send (Code.gs doPost); anything else is dropped.
  var FIELDS = ['do', 'code', 'username', 'password', 'web', 'challenge', 'otp', 'who', 'id', 'check'];

  var frame = document.getElementById('app'), load = document.getElementById('load'), slow = document.getElementById('slow'), direct = document.getElementById('direct');
  var here = location.pathname.replace(/[^\/]*$/, ''), title = document.title, timer = 0, reveal = 0, talking = false;
  var SHOW = 6000;   // the app has loaded but has not said hello (the Public address not set yet): show it anyway after this
  frame.addEventListener('load', function () {
    clearTimeout(reveal);
    if (!talking) reveal = setTimeout(function () { clearTimeout(timer); load.classList.add('off'); slow.hidden = true; }, SHOW);
  });
  var query = function (q) { q = String(q || ''); return q === '' || (q.charAt(0) === '?' && q.length < 2000 && !/[#\s]/.test(q)) ? q : null; };
  var secret = function (q) { return /[?&](lc|reset)=/.test(q); };   // one-time codes never stay in the address bar
  function waiting() {
    load.classList.remove('off'); slow.hidden = true;
    clearTimeout(timer); timer = setTimeout(function () { slow.hidden = false; }, WAIT);
  }
  function open(q) {
    direct.href = EXEC + q;
    waiting();
    frame.src = EXEC + q;
    try { history.replaceState(null, '', here + (secret(q) ? '' : q)); } catch (e) { /* fine */ }
  }
  function post(fields) {
    var f = document.createElement('form');
    f.method = 'post'; f.action = EXEC; f.target = 'zsapp'; f.hidden = true;
    FIELDS.forEach(function (k) {
      if (!Object.prototype.hasOwnProperty.call(fields, k)) return;
      var i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = String(fields[k]).slice(0, 500); f.appendChild(i);
    });
    document.body.appendChild(f);
    waiting();
    f.submit();
    setTimeout(function () { f.remove(); }, 1000);
    try { history.replaceState(null, '', here); } catch (e) { /* fine */ }
  }
  window.addEventListener('message', function (e) {
    var d = e.data, inside = false;
    try { inside = !!e.source && e.source.top === window && e.source !== window; } catch (err) { inside = false; }
    if (!APP_FRAME.test(e.origin) || !inside || !d || typeof d !== 'object') return;
    if (d.zs === 'hello') {
      talking = true; clearTimeout(reveal); clearTimeout(timer); load.classList.add('off'); slow.hidden = true;
      document.title = typeof d.title === 'string' && d.title ? d.title.slice(0, 120) : title;
      e.source.postMessage({ zs: 'wrapped' }, e.origin);
    } else if (d.zs === 'go') {
      var q = query(d.q);
      if (q !== null) open(q);
    } else if (d.zs === 'post' && d.fields && typeof d.fields === 'object') {
      post(d.fields);
    }
  });
  var first = query(location.search);
  open(first === null ? '' : first);
})();
</script>
</body>
</html>
